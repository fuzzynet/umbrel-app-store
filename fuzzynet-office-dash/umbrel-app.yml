manifestVersion: 1
id: fuzzynet-office-dash
name: Office Dashboard Feed
tagline: Revenue, weather, calendar and photos for a TV screensaver
icon: https://raw.githubusercontent.com/fuzzynet/umbrel-app-store/main/fuzzynet-office-dash/icon.svg
category: finance
version: "1.4.0"
port: 8790
description: >-
  A small feed for the tvhome launcher's "Office dashboard" screensaver. It serves revenue (today,
  trailing 30 days or MRR, year to date and all-time) pushed by an admin machine from its billing
  systems, Open-Meteo weather, an uploaded calendar for today, and rotating Wikimedia Commons landscape photos,
  and serves them as JSON for Android TV boxes on the local network.


  There is nothing to type in after installing. Secrets are pushed from an admin machine through
  a signed provisioning request and stored in the app's data folder (mode 600). The page you open
  from umbrelOS only shows status and never displays a key.
developer: fuzzynet
website: https://github.com/fuzzynet/umbrel-app-store
submitter: fuzzynet
submission: https://github.com/fuzzynet/umbrel-app-store
repo: https://github.com/fuzzynet/umbrel-app-store
support: https://github.com/fuzzynet/umbrel-app-store/issues
gallery: []
releaseNotes: >-
  The feed can now compute revenue itself. When an admin machine provisions WHMCS API credentials,
  the expected home IPv4 and an Invoice Ninja token (stored only in the app's data folder, mode 600),
  the feed polls WHMCS GetTransactions every 5 minutes (read-only, only when its public IP matches the
  allowlisted home IP) and Invoice Ninja payments every 2 minutes, and produces the same TODAY / 30 DAYS /
  YTD / ALL-TIME totals and new-payment pop-ups as the admin machine's collector. Any WHMCS
  authentication or access error stops WHMCS polling until credentials are provisioned again.
  POST /revenue pushes still work as a fallback; the newest data wins. /health reports the revenue source.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
