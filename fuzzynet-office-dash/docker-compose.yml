version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: fuzzynet-office-dash_feed_1
      APP_PORT: 8787
      # The status page (/) stays behind the umbrelOS login. These paths carry their own
      # token or signature checks, so TVs and the admin box can reach them directly.
      PROXY_AUTH_WHITELIST: "/feed.json,/photos/*,/health,/calendar,/provision"

  feed:
    # Official multi-arch Python image (amd64 + arm64), pinned by digest. The app code is
    # feed.py, rendered by umbrelOS from feed.py.template on install and on every update.
    image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    user: "1000:1000"
    init: true
    restart: on-failure
    command: ["python", "-u", "/app/feed.py"]
    volumes:
      - ${APP_DATA_DIR}/feed.py:/app/feed.py:ro
      - ${APP_DATA_DIR}/data:/data
    environment:
      DASH_DATA: /data
      DASH_PORT: "8787"
      PYTHONDONTWRITEBYTECODE: "1"
      # Public half of the admin box's provisioning key. Only payloads signed with the
      # matching private key are accepted by POST /provision. Not a secret.
      DASH_PROVISION_KEY: "rsa:65537:"
